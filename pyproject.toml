[project]
name = "document-sorter"
version = "0.2.0"
description = "AI-powered household document sorter and classifier"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
ollama = [
    "openai>=1.0.0",
]
gemini = [
    "google-genai>=1.0.0",
]
claude = [
    "anthropic>=0.39.0",
]
drive = [
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.1.0",
]
gui = [
    "flask>=3.0.0",
]
all = [
    "document-sorter[ollama,gemini,claude,drive,gui]",
]

[project.scripts]
docsort = "document_sorter.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["document_sorter*"]
